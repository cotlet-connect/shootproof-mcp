[project]
name = "shootproof-mcp"
version = "1.1.0"
description = "Connect ShootProof to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No ShootProof API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["shootproof", "shootproof api", "shootproof mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/shootproof-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=shootproof"
Source = "https://github.com/cotlet-connect/shootproof-mcp"

[project.scripts]
shootproof-mcp = "shootproof_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"shootproof_agent.py" = "shootproof_agent.py"

[tool.hatch.build.targets.sdist]
include = ["shootproof_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
